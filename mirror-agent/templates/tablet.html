<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>镜面精灵屏</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='tablet.css') }}">
  </head>
  <body>
    <main class="tablet-shell">
      <p class="tablet-eyebrow">Mirror Tablet</p>
      <section class="tablet-stage-shell" aria-label="镜面动画展示区">
        <div id="tablet-stage" class="tablet-stage" data-scene="startup"></div>
      </section>
      <section id="tablet-reminder" class="tablet-reminder" aria-live="polite" hidden>
        <p id="tablet-countdown-label" class="tablet-reminder-label">倒计时</p>
        <p id="tablet-countdown-value" class="tablet-countdown-value">00:00</p>
        <p id="tablet-reminder-meta" class="tablet-reminder-meta"></p>
        <p id="tablet-reminder-message" class="tablet-reminder-message"></p>
      </section>
      <p id="tablet-scene-label" class="tablet-scene-label">启动欢迎</p>
    </main>

    <script src="{{ url_for('static', filename='tablet.js') }}"></script>
  </body>
</html>
